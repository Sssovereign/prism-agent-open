<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>棱镜 Prism</title>
    <link rel="icon" type="image/png" href="/assets/prism-p-approved.png">
    <script>
      // 首帧前解析主题与护眼偏好，避免闪色。仅存非敏感偏好，不存内容草稿。
      (function () {
        try {
          var p = localStorage.getItem('prism-theme');
          var dark = p === 'dark' || ((!p || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var prefs = {};
          try { prefs = JSON.parse(localStorage.getItem('prism-preferences') || '{}'); } catch (pe) { /* 忽略 */ }
          document.documentElement.dataset.eyeCare = String(prefs.eyeCare === true);
        } catch (e) { /* 忽略 */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
